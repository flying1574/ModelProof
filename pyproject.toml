[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelproof"
version = "0.1.0"
description = "用可验真数据鉴别与验证大模型身份：指纹、响应特征、分层置信度"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ModelProof contributors" }]
keywords = ["llm", "fingerprint", "model-identification", "verification", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心刻意只依赖标准库；下面这些只用于 CLI / Web / 可选增强。
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
web = ["Flask>=3.0"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/modelproof/modelproof"
Documentation = "https://github.com/modelproof/modelproof/blob/main/DESIGN.md"
Issues = "https://github.com/modelproof/modelproof/issues"

[project.scripts]
modelproof = "modelproof.cli.main:cli"

[tool.setuptools.packages.find]
include = ["modelproof*"]

[tool.setuptools.package-data]
modelproof = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]
